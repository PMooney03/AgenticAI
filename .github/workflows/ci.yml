# Lint, test, eval, and build images. No Ollama, no secrets, no push.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, test, eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      - name: Golden-set eval
        run: uv run python -m app.eval

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Compose config and image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile app config
      - name: Build backend and frontend images
        run: docker compose --profile app build
      - name: Fake-provider compose smoke
        run: |
          docker compose -f docker-compose.fake.yml up --build -d --wait
          curl -fsS http://127.0.0.1:18000/health -o /tmp/asb-health.json
          python3 -c "import json; d=json.load(open('/tmp/asb-health.json')); assert d['status']=='ok', d"
          curl -fsS http://127.0.0.1:18000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"hello","use_documents":false}' \
            -o /tmp/asb-chat.json
          python3 -c "import json; d=json.load(open('/tmp/asb-chat.json')); assert d.get('answer'), d"
      - name: Tear down fake stack
        if: always()
        run: docker compose -f docker-compose.fake.yml down -v
