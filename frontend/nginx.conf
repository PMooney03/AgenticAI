# Same-origin reverse proxy: the browser talks to :8080 only. API paths go to the
# backend service; everything else is the Vite production bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # Uploads are capped at 20 MB in FastAPI; leave a little headroom here.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS. A variable proxy_pass defers lookup so nginx can
    # start (and `nginx -t`) before the backend hostname exists.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location ~ ^/(health|chat|documents|agent|metrics|eval|docs|openapi\.json|redoc) {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass_header X-Request-ID;
    }
}
