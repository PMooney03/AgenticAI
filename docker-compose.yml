# Local stack. Ollama stays on the host (GPU/models already live there).
#
#   docker compose up -d qdrant                  # host-dev: only the vector DB
#   docker compose --profile app up -d --build   # full stack on localhost
#
# Published ports bind to 127.0.0.1 so nothing is reachable from the LAN.

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: asb-qdrant
    ports:
      - "127.0.0.1:6333:6333" # REST API + web dashboard (http://localhost:6333/dashboard)
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough for a TCP readiness probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asb-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      DATA_DIR: /data
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-3}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asb-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
