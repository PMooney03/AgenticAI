# Phase 2: only Qdrant runs in Docker. The backend runs on the host with `uv run uvicorn`
# and Ollama runs on the host. Phase 8 adds `backend` and `frontend` services.
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: asb-qdrant
    ports:
      - "6333:6333" # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough for a TCP readiness probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
